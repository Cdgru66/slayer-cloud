<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --lac:#140c0e;--lac1:#180e11;--lac2:#1c1215;--lac3:#251a1d;--edge:#3a2a2c;--hair:#2c1f22;--row:#241719;
  --tx:#f1e9dd;--tx2:#d9cfc3;--mu:#9d9088;--mu2:#b5a99f;--dim:#6d625c;
  --gold:#e2b65c;--gold-hi:#f6dd9c;--gold-lo:#8f6c2c;--steel:#9db8c9;
  --seal:#d8432c;--seal-lo:#8e2416;--ok:#5fd0a0;--warn:#e9a24a;--red:#ef7b6c;
  --serif:'Noto Serif Thai','Noto Serif',Georgia,serif;
  --sans:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{color-scheme:dark;scrollbar-width:thin;scrollbar-color:#4a3436 var(--lac)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a2a2c;border-radius:10px;border:2px solid var(--lac)}
::-webkit-scrollbar-thumb:hover{background:var(--gold-lo)}
::-webkit-scrollbar-corner{background:transparent}
body{background:var(--lac);color:var(--tx);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  background-image:radial-gradient(60rem 30rem at 90% -20%,rgba(216,67,44,.10),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---- แถบบน ---- */
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--hair);background:var(--lac1);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#fff3e6;background:linear-gradient(145deg,var(--seal),var(--seal-lo));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.brand b{font:700 15px var(--serif);color:var(--gold-hi)}
.brand .ver{font:12px var(--mono);color:var(--mu)}
.tr{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--mu);min-width:0}
.conn{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--dim));flex:none}
.pulse{box-shadow:0 0 0 0 var(--c);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lang{display:flex;background:var(--lac2);border:1px solid var(--edge);border-radius:8px;padding:2px;flex:none}
.lang button{border:0;background:transparent;color:var(--mu);padding:3px 11px;border-radius:6px;cursor:pointer;font-size:12px}
.lang button[aria-pressed=true]{background:var(--edge);color:var(--gold-hi);font-weight:600}

/* ---- โครง ---- */
.shell{display:flex;flex-wrap:wrap;min-height:calc(100vh - 46px)}
nav.side{flex:1 1 210px;max-width:230px;background:var(--lac1);border-right:1px solid var(--hair);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:10px;border:0;cursor:pointer;margin-bottom:14px;font-weight:700;color:#2a1a08;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 8px 22px -10px rgba(226,182,92,.6)}
.go:hover{filter:brightness(1.06)}.go:disabled{opacity:.6;cursor:wait}
.sect{font-size:11px;letter-spacing:.08em;color:var(--dim);padding:10px 10px 4px}
.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 10px;border-radius:8px;color:var(--mu2);background:transparent;border:0;cursor:pointer;text-align:left;width:100%}
.nv:hover{color:var(--tx);background:rgba(241,233,221,.04)}
.nv[aria-current=page]{background:var(--lac3);color:var(--tx);font-weight:600;box-shadow:inset 0 0 0 1px var(--edge)}
.nv svg{flex:none;opacity:.8}.nv span:first-child{display:flex;align-items:center;gap:10px}
.cnt{font:12px var(--mono);background:var(--edge);padding:1px 8px;border-radius:6px;color:var(--tx2)}
.qs{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;padding-top:14px}
.qs div{background:var(--lac2);border:1px solid var(--hair);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;gap:4px}
.qs b{font:600 12px var(--mono)}.qs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:999 1 560px;min-width:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}

/* ---- ส่วนประกอบ ---- */
h1{font:700 21px var(--serif)}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--edge);background:var(--lac2);color:var(--tx2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#5a4244;color:var(--tx)}.btn:disabled{opacity:.55;cursor:wait}
.btn.gold{background:#2a1d12;border-color:var(--gold-lo);color:var(--gold-hi);font-weight:600}
.btn.gold:hover{border-color:var(--gold)}
.btn.red{border-color:rgba(239,123,108,.45);color:#ffb3a8}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.ic{width:32px;padding:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--lac2);border:1px solid var(--hair);border-radius:12px;padding:14px 16px;min-width:0}
.tile .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mu)}
.tile .v{font:600 20px var(--mono);color:var(--tx)}
.tile .v small{font-size:12px;color:var(--mu);font-weight:400}
.tile .s{font-size:11.5px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;background:#2a1d20;border-radius:3px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--mc,var(--gold));transition:width .6s}
.banner{padding:10px 14px;border-radius:10px;background:#2e1715;border:1px solid rgba(239,123,108,.35);color:#ffc2b8;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--lac2);border:1px solid var(--hair);border-radius:10px;color:var(--mu)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--tx)}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--lac2);border:1px solid var(--hair);border-radius:10px;padding:4px}
.seg button{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:var(--mu);cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--edge);color:var(--tx);font-weight:600}
.seg .n{font:12px var(--mono);opacity:.75}
.box{background:var(--lac2);border:1px solid var(--hair);border-radius:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mu);font-size:11px;font-weight:500;letter-spacing:.04em;padding:11px 8px;white-space:nowrap}
th:first-child,td:first-child{padding-left:16px}th:last-child,td:last-child{padding-right:16px}
td{padding:9px 8px;border-top:1px solid var(--row);vertical-align:middle}
tr:hover td{background:rgba(241,233,221,.018)}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.av{width:38px;height:38px;border-radius:50%;flex:none;background:#2a1d20;box-shadow:0 0 0 2px var(--avc,var(--edge));display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--gold);position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s;background:#2a1d20}
.av.has img{opacity:1}.av.has .ini{visibility:hidden}.av .ini{font-size:12px}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.who span{font-size:11.5px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.now{color:var(--tx2);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{color:var(--tx);font-weight:600}
.mut{color:var(--mu)}.dim{color:var(--dim)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--edge);transition:.2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.sw input:checked+i{background:#5a4320}.sw input:checked+i::after{left:21px;background:var(--gold-hi)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{padding:18px;display:flex;flex-direction:column}
.card h2{font:700 15px var(--sans)}
.card .sub{font-size:12px;color:var(--mu);margin:2px 0 8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--hair)}
.opt b{display:block;font-weight:600}.opt small{display:block;font-size:12px;color:var(--mu)}
.sel,.num,.txt{height:38px;padding:0 10px;background:var(--lac);border:1px solid var(--edge);border-radius:9px;color:var(--tx)}
.num{width:76px;font-family:var(--mono)}.txt{font-family:var(--mono);width:100%;max-width:300px}
.pcol .sel{height:32px;font-size:12.5px;max-width:160px}
body:not(.per) .pcol{display:none}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:4px 0 14px}
.game{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--lac);border:1px solid var(--hair);cursor:pointer;text-align:left;color:var(--tx)}
.game[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-lo) inset}
.game .gi{width:48px;height:48px;border-radius:10px;background:var(--lac3);display:grid;place-items:center;font:700 15px var(--mono);color:var(--c)}
.game b{display:block;font-weight:600}.game .gid{font:12px var(--mono);color:var(--mu)}
.ram{display:flex;align-items:center;gap:10px;min-width:200px}
.ram .meter{flex:1;margin:0}
.ram span{width:72px;text-align:right;font-family:var(--mono);color:var(--tx2)}
.logs{list-style:none;padding:6px 0;max-height:calc(100vh - 210px);overflow:auto}
.logs li{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--row);font-size:13px}
.logs li:first-child{border-top:0}
.logs time{flex:none;width:150px;color:var(--dim);font:12px var(--mono)}
.logs li.bad{color:#ffb3a8}.logs li.good{color:#a8e3c6}
.hint{font-size:12px;color:var(--mu)}
.res{max-height:110px;overflow:auto;font-size:12px;color:#ffb3a8;display:grid;gap:2px;padding:8px 10px;border-radius:8px;background:#2e1715}
/* ---- หน้าต่างเพิ่มไอดี ---- */
.modal{position:fixed;inset:0;background:rgba(10,5,6,.74);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:20}
.sheet{width:min(560px,100%);background:var(--lac2);border:1px solid var(--edge);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--hair)}
.sheet h2{font:700 17px var(--serif)}
.sheet .sb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet .sf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--hair)}
.steps{padding-left:20px;color:var(--mu2);font-size:13px;display:grid;gap:4px}.steps b{color:var(--tx)}
textarea{width:100%;height:160px;resize:none;padding:10px 12px;background:var(--lac);border:1px solid var(--edge);border-radius:10px;font:12px var(--mono);color:var(--tx)}
.safe{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#14271e;color:#a8e3c6;font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:11px;background:#1f3a2e;box-shadow:inset 0 0 0 1px rgba(95,208,160,.45);transition:.25s;z-index:30;font-size:13px;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.bad{background:#3a1f1f;box-shadow:inset 0 0 0 1px rgba(239,123,108,.5)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){nav.side{max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--hair)}.nv{width:auto}.sect,.qs{display:none}.go{width:100%;margin-bottom:4px}main{padding:16px}.tr .conn{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="seal" aria-hidden="true">艦</span><b>Fleet Launcher</b><span class="ver" id="ver"></span></div>
  <div class="tr">
    <span class="conn" id="conn"><span class="dot"></span><span data-i="connecting"></span></span>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">EN</button></div>
  </div>
</header>
<div class="shell">
  <nav class="side" aria-label="menu">
    <button type="button" class="go" id="rjall"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg><span data-i="rejoinOff"></span></button>
    <div class="sect" data-i="sGeneral"></div>
    <button type="button" class="nv" data-v="acc"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21c0-3-2-5-4-5.6"/></svg><span data-i="nAcc"></span></span><span class="cnt" id="n-acc">0</span></button>
    <button type="button" class="nv" data-v="game"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 10v4M5 12h4"/><circle cx="16" cy="11" r="1"/><circle cx="18" cy="13" r="1"/></svg><span data-i="nGame"></span></span></button>
    <div class="sect" data-i="sPc"></div>
    <button type="button" class="nv" data-v="perf"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span data-i="nPerf"></span></span></button>
    <button type="button" class="nv" data-v="log"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i="nLog"></span></span></button>
    <div class="qs" id="qs"></div>
  </nav>

  <main>
    <div class="banner" id="banner" hidden></div>

    <!-- ===== ไอดี ===== -->
    <section class="view" id="v-acc">
      <div class="tiles">
        <div class="tile"><p class="l"><span data-i="tOnline"></span><span class="v" id="t-on">–</span></p><div class="meter"><i id="m-on" style="--mc:var(--ok);width:0"></i></div><p class="s" id="s-on"></p></div>
        <div class="tile"><p class="l"><span>CPU</span><span class="v" id="t-cpu">–</span></p><div class="meter"><i id="m-cpu" style="--mc:var(--steel);width:0"></i></div><p class="s" id="s-cpu"></p></div>
        <div class="tile"><p class="l"><span>RAM</span><span class="v" id="t-ram">–</span></p><div class="meter"><i id="m-ram" style="--mc:var(--ok);width:0"></i></div><p class="s" id="s-ram"></p></div>
        <div class="tile"><p class="l"><span data-i="tRoblox"></span><span class="v" id="t-rb">–</span></p><div class="meter"><i id="m-rb" style="--mc:var(--gold);width:0"></i></div><p class="s" id="s-rb"></p></div>
      </div>
      <div class="head">
        <h1 data-i="hAcc"></h1>
        <div class="acts">
          <button type="button" class="btn" id="check" data-i="checkCk"></button>
          <button type="button" class="btn gold" id="add" data-i="addAcc"></button>
        </div>
      </div>
      <div class="bar">
        <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" data-ip="search" autocomplete="off"></label>
        <div class="seg" id="filters" role="group"></div>
      </div>
      <div class="box tbl">
        <table>
          <thead><tr><th data-i="cAcc"></th><th data-i="cStatus"></th><th data-i="cNow"></th><th>Lv</th><th>Token · Ore</th><th data-i="cLast"></th><th data-i="cGame" class="pcol"></th><th data-i="cAuto"></th><th style="text-align:right" data-i="cAct"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== เกม ===== -->
    <section class="view" id="v-game" hidden>
      <h1 data-i="hGame"></h1>
      <div class="box card">
        <h2 data-i="gPick"></h2><p class="sub" data-i="gPickSub"></p>
        <div class="seg" id="gmode" role="group" style="align-self:flex-start;margin-bottom:12px"><button type="button" data-gm="shared" data-i="gmShared"></button><button type="button" data-gm="per" data-i="gmPer"></button></div>
        <p class="hint" id="gmHint" style="margin:-4px 0 12px"></p>
        <div class="games" id="games"></div>
        <label class="opt" style="justify-content:flex-start;flex-wrap:wrap"><span style="min-width:120px"><b>Place ID</b><small data-i="gCustom"></small></span><input class="txt" id="place" inputmode="numeric" autocomplete="off"><button type="button" class="btn gold sm" id="placeSave" data-i="save"></button></label>
      </div>
      <div class="box card">
        <h2 data-i="gAuto"></h2><p class="sub" data-i="gAutoSub"></p>
        <div class="opt"><span><b data-i="gAutoOn"></b><small data-i="gAutoOnSub"></small></span><label class="sw"><input type="checkbox" id="auto" data-ia="gAutoOn"><i></i></label></div>
        <div class="opt"><span><b data-i="gAfter"></b><small data-i="gAfterSub"></small></span><span><input class="num" id="after" type="number" min="2" max="120" data-ia="gAfter"> <span data-i="min"></span></span></div>
        <div class="opt"><span><b data-i="gGap"></b><small data-i="gGapSub"></small></span><span><input class="num" id="gap" type="number" min="5" max="120" data-ia="gGap"> <span data-i="sec"></span></span></div>
      </div>
    </section>

    <!-- ===== ประหยัดเครื่อง ===== -->
    <section class="view" id="v-perf" hidden>
      <div class="head">
        <h1 data-i="hPerf"></h1>
        <div class="acts"><button type="button" class="btn" id="minAll" data-i="minAll"></button><button type="button" class="btn gold" id="trim" data-i="trimNow"></button></div>
      </div>
      <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">
        <div class="tile"><p class="l" data-i="pTotal"></p><p class="v" id="p-total">–</p><p class="s" id="p-total-s"></p></div>
        <div class="tile"><p class="l" data-i="pAvg"></p><p class="v" id="p-avg">–</p><p class="s" id="p-avg-s"></p></div>
        <div class="tile"><p class="l" data-i="pSaved"></p><p class="v" id="p-saved" style="color:var(--ok)">–</p><p class="s" id="p-saved-s"></p></div>
      </div>
      <div class="grid2">

function rows(){
  const after=(S.cfg.afterMin||5)*60,ex=new Set(S.cfg.exclude.map(x=>x.toLowerCase())),m=new Map();
  for(const a of (S.fleet&&S.fleet.accounts)||[])m.set(a.name.toLowerCase(),{name:a.name,f:a});
  for(const l of S.launcher){const k=l.name.toLowerCase();m.set(k,Object.assign(m.get(k)||{name:l.name},{l}))}
  const ord={off:0,busy:1,late:2,never:3,on:4};
  return[...m.values()].map(r=>{const f=r.f,l=r.l;let st;
    if(l&&l.busy)st='busy';else if(!f)st='never';else if(f.last<150||(f.liveAgo!=null&&f.liveAgo<60))st='on';else if(f.last<after)st='late';else st='off';
    return Object.assign(r,{st,auto:!ex.has(r.name.toLowerCase())})}).sort((a,b)=>ord[a.st]-ord[b.st]||a.name.localeCompare(b.name))}

  if(u){const i=h('img',{src:u,alt:'',referrerpolicy:'no-referrer'});i.onload=()=>{AVOK.add(u);d.classList.add('has')};i.onerror=()=>i.remove();d.append(i)}return d}

function render(){
  if(!S)return;
  document.body.classList.toggle('per',S.cfg.gameMode==='per');
  const R=rows(),cnt={all:R.length,on:0,off:0,busy:0,nocookie:0};
  R.forEach(r=>{if(r.st==='on')cnt.on++;if(r.st==='off'||r.st==='late')cnt.off++;if(r.st==='busy')cnt.busy++;if(!r.l)cnt.nocookie++});
  // แถบบน + เมนู
  const c=$('#conn');c.replaceChildren(h('span',{class:'dot'+(S.fleet?' pulse':''),style:'--c:'+(S.fleet?'var(--ok)':'var(--red)')}),S.fleet?t('connOk')+S.fleet.version:t('connBad'));
  $('#ver').textContent=S.version||'';
  $('#banner').hidden=!S.fleetErr;$('#banner').textContent=S.fleetErr||'';
  $('#n-acc').textContent=cnt.all;
  $('#qs').replaceChildren(...[['qOn',cnt.on,'var(--ok)'],['qOff',cnt.off,'var(--red)'],['qBusy',cnt.busy,'var(--gold)'],['qNo',cnt.nocookie,'var(--mu)']].map(([k,n,col])=>h('div',{},h('span',{style:'color:'+col},t(k)),h('b',{},n))));
  if(view==='acc')renderAcc(R,cnt);
  if(view==='game')renderGame();
  if(view==='perf')renderPerf();
  if(view==='log')renderLog();
}

  const sy=S.sys,rp=Math.round(sy.ramUsed/sy.ramTotal*100),rbMb=(sy.procs||[]).reduce((a,p)=>a+p.mb,0);
  $('#t-on').replaceChildren(String(cnt.on),h('small',{},' / '+cnt.all));$('#m-on').style.width=(cnt.all?cnt.on/cnt.all*100:0)+'%';$('#s-on').textContent=t('onSub',{n:cnt.all});
  $('#t-cpu').textContent=sy.cpu+'%';$('#m-cpu').style.width=sy.cpu+'%';$('#m-cpu').style.setProperty('--mc',sy.cpu>85?'var(--red)':'var(--steel)');$('#s-cpu').textContent='';
  $('#t-ram').textContent=rp+'%';$('#m-ram').style.width=rp+'%';$('#m-ram').style.setProperty('--mc',rp>90?'var(--red)':rp>75?'var(--warn)':'var(--ok)');$('#s-ram').textContent=t('usedOf',{a:gb(sy.ramUsed),b:gb(sy.ramTotal)});
  $('#t-rb').textContent=sy.roblox;$('#m-rb').style.width=Math.min(100,rbMb/(sy.ramTotal/1048576)*100)+'%';$('#s-rb').textContent=t('rbSub',{g:(rbMb/1024).toFixed(1)});
  $('#filters').setAttribute('aria-label',t('cStatus'));
  $('#filters').replaceChildren(...[['all','fAll','var(--mu)'],['on','fOn','var(--ok)'],['off','fOff','var(--red)'],['busy','fBusy','var(--gold)'],['nocookie','fNo','var(--dim)']].map(([k,l,col])=>h('button',{type:'button','aria-pressed':String(flt===k),onclick:()=>{flt=k;render()}},h('span',{class:'dot',style:'--c:'+col}),t(l),h('span',{class:'n'},cnt[k]))));
  const F=R.filter(r=>(flt==='all'||(flt==='off'?(r.st==='off'||r.st==='late'):flt==='nocookie'?!r.l:r.st===flt))&&r.name.toLowerCase().includes(q));
  $('#rows').replaceChildren(...(F.length?F.map(row):[h('tr',{},h('td',{colspan:9,class:'empty'},R.length?t('emptyF'):t('emptyAll')))]));
}
function row(r){const f=r.f||{},l=r.l,[sk,col]=ST[r.st];
  let now;
  if(f.boss)now=[t('fighting'),h('b',{},f.boss)];
  else if(f.quest)now=[h('b',{},f.quest.name),f.quest.max?' '+f.quest.v+'/'+f.quest.max:''];
  else if(f.holding)now=[h('b',{},f.holding)];
  else now=[r.st==='never'?h('span',{class:'dim'},t('noData')):f.goal?t('goal')+f.goal:h('span',{class:'dim'},'—')];
  const acts=[];
  if(l)acts.push(h('button',{type:'button',class:'btn sm gold',onclick:e=>{if(r.st==='on'&&!confirm(t('confirmRj',{n:r.name})))return;act(e.currentTarget,'/ui/rejoin',{name:r.name})}},'⟳ '+t('rejoin')));
  else acts.push(h('button',{type:'button',class:'btn sm gold',onclick:openAdd},t('addCk')));
  if(l&&l.window)acts.push(h('button',{type:'button',class:'btn sm',onclick:e=>act(e.currentTarget,'/ui/close',{name:r.name})},t('closeG')));
  if(l)acts.push(h('button',{type:'button',class:'btn sm ic','aria-label':t('del')+' '+r.name,title:t('del'),onclick:()=>{if(confirm(t('confirmDel',{n:r.name})))act(null,'/ui/remove',{name:r.name})}},'✕'));
  return h('tr',{},
    h('td',{},h('div',{class:'who'},avatar(r.name,col),h('div',{},h('b',{},f.display||r.name),h('span',{},'@'+r.name)))),
    h('td',{},h('span',{class:'pill',style:'--c:'+col},h('i',{class:'dot'+(r.st==='on'||r.st==='busy'?' pulse':''),style:'--c:'+col}),t(sk))),
    h('td',{},h('div',{class:'now'},now)),
    h('td',{class:'mono'},f.level!=null?String(f.level):'–'),
    h('td',{class:'mono mut'},cm(f.token)+' · '+cm(f.ore)),
    h('td',{class:'mut'},f.last!=null?ago(f.last):'–',f.rejoin?h('div',{class:'dim',style:'font-size:11.5px'},t('rejoin')+' ×'+f.rejoin.n):null),
    h('td',{class:'pcol'},gameSel(r.name)),
    h('td',{},l?sw(r.auto,t('cAuto')+' '+r.name,v=>act(null,'/ui/settings',{name:r.name,auto:v})):h('span',{class:'dim'},'—')),
    h('td',{},h('div',{class:'rowacts'},acts)))}

function gameSel(name){const cur=Number((S.cfg.places||{})[name.toLowerCase()])||0,opts=[h('option',{value:0},t('gMain'))].concat(GAMES.map(g=>h('option',{value:g.id},g.name)));
  if(cur&&!GAMES.some(g=>g.id===cur))opts.push(h('option',{value:cur},String(cur)));
  const s=h('select',{class:'sel','aria-label':t('cGame')+' '+name},opts);s.value=String(cur);s.onchange=()=>act(null,'/ui/settings',{name,accPlace:Number(s.value)||0});return s}
const GAMES=[{name:'Slayers 2',id:16205713724,ini:'S2',c:'var(--red)'},{name:'Steal An Egg',id:107778070777162,ini:'EG',c:'var(--gold)'}];
function renderGame(){
  const pid=S.cfg.placeId,per=S.cfg.gameMode==='per';
  $$('[data-gm]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.gm==='per')===per)));$('#gmHint').textContent=t(per?'gmHintP':'gmHintS');
  $('#games').replaceChildren(...GAMES.map(g=>h('button',{type:'button',class:'game','aria-pressed':String(pid===g.id),onclick:e=>act(e.currentTarget,'/ui/settings',{placeId:g.id})},h('span',{class:'gi',style:'--c:'+g.c},g.ini),h('span',{},h('b',{},g.name),h('span',{class:'gid'},String(g.id))))));
  if(document.activeElement!==$('#place'))$('#place').value=pid;
  if(document.activeElement!==$('#auto'))$('#auto').checked=S.cfg.enabled;
  if(document.activeElement!==$('#after'))$('#after').value=S.cfg.afterMin;
  if(document.activeElement!==$('#gap'))$('#gap').value=S.cfg.perf.staggerSec;
}
function renderPerf(){
  const P=S.cfg.perf,sy=S.sys,pr=sy.procs||[],tot=pr.reduce((a,p)=>a+p.mb,0),ex=new Set(P.except.map(x=>x.toLowerCase()));
  $('#p-total').textContent=(tot/1024).toFixed(1)+' GB';$('#p-total-s').textContent=t('pWins',{n:pr.length})+' · '+t('pOfTotal',{g:gb(sy.ramTotal)});
  $('#p-avg').textContent=pr.length?Math.round(tot/pr.length)+' MB':'–';$('#p-avg-s').textContent='';
  const tr=sy.trim||{};$('#p-saved').textContent=(tr.todayMb||0)>=1024?((tr.todayMb/1024).toFixed(1)+' GB'):(tr.todayMb||0)+' MB';
  $('#p-saved-s').textContent=tr.at?t('pLast',{t:ago((Date.now()-tr.at)/1000)}):t('pNever');
  for(const k of ['no3d','lowGfx','minimize'])if(document.activeElement!==$('#'+k))$('#'+k).checked=!!P[k];
  if(document.activeElement!==$('#fps'))$('#fps').value=String(P.fps);
  if(document.activeElement!==$('#trimMin'))$('#trimMin').value=String(P.trimMin);
  if(document.activeElement!==$('#gap2'))$('#gap2').value=P.staggerSec;
  // แถวละไอดี: ไอดีที่มี cookie + หน้าต่าง Roblox ที่เปิดอยู่
  const names=new Map();for(const l of S.launcher)names.set(l.name.toLowerCase(),{name:l.name,mb:null});
  const unknown=[];for(const p of pr){if(p.name&&names.has(p.name.toLowerCase()))names.get(p.name.toLowerCase()).mb=p.mb;else if(p.name)names.set(p.name.toLowerCase(),{name:p.name,mb:p.mb});else unknown.push(p)}
  const max=Math.max(1500,...pr.map(p=>p.mb));
  const bar=mb=>h('div',{class:'ram'},h('div',{class:'meter'},h('i',{style:'width:'+(mb?Math.min(100,mb/max*100):0)+'%;--mc:'+(mb>1400?'var(--warn)':'var(--gold)')})),h('span',{},mb!=null?mb+' MB':'–'));
  const list=[...names.values()].map(x=>h('tr',{},h('td',{},h('div',{class:'who'},avatar(x.name,x.mb!=null?'var(--gold-lo)':'var(--edge)'),h('b',{},x.name))),h('td',{},bar(x.mb)),
    h('td',{},sw(!ex.has(x.name.toLowerCase()),t('c3d')+' '+x.name,v=>setP({except:!v},x.name)))));
  for(const p of unknown)list.push(h('tr',{},h('td',{class:'mut'},t('unknownWin',{p:p.pid})),h('td',{},bar(p.mb)),h('td',{class:'dim'},'—')));
  $('#procs').replaceChildren(...(list.length?list:[h('tr',{},h('td',{colspan:3,class:'empty'},t('noWin')))]));
}
function renderLog(){
  $('#logs').replaceChildren(...(S.log.length?S.log.map(l=>{const m=l.match(/^(\S+\s+\S+)\s+(.*)$/)||[0,'',l];return h('li',{class:/ไม่สำเร็จ|ผิดพลาด|ใช้ไม่ได้|ต่อ.*ไม่ได้/.test(m[2])?'bad':/กลับมาออนไลน์|เพิ่มไอดี|กำลังเข้าเกม|คืน RAM/.test(m[2])?'good':''},h('time',{},m[1]),h('span',{},m[2]))}):[h('li',{class:'mut'},t('noLog'))]));
}

async function load(){try{S=await api('/ui/state');render()}catch(e){$('#conn').replaceChildren(h('span',{class:'dot',style:'--c:var(--red)'}),t('stopped'))}}
function closeAdd(){$('#modal').hidden=true;$('#ck').value='';$('#ckres').hidden=true;$('#ckn').textContent=''}
function openAdd(){$('#modal').hidden=false;$('#ck').value='';$('#ckres').hidden=true;$('#ckn').textContent=t('ckLines',{n:0});setTimeout(()=>$('#ck').focus(),50)}
$('#add').onclick=openAdd;$('#cancel').onclick=closeAdd;$('#x').onclick=closeAdd;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeAdd()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeAdd()});
const ckCount=()=>$('#ck').value.split(/\r?\n/).filter(l=>l.trim()).length;
$('#ck').oninput=()=>{$('#ckn').textContent=t('ckLines',{n:ckCount()})};
$('#addf').onsubmit=async e=>{e.preventDefault();$('#ckres').hidden=true;const r=await act($('#save'),'/ui/add',{cookie:$('#ck').value});
  if(r&&r.bad&&r.bad.length){$('#ckres').replaceChildren(...r.bad.map(b=>h('div',{},b)));$('#ckres').hidden=false;$('#ck').value='';$('#ckn').textContent=''}
  else if(r&&r.ok)closeAdd()};
$$('[data-gm]').forEach(b=>b.onclick=()=>act(b,'/ui/settings',{gameMode:b.dataset.gm}));
$('#rjall').onclick=e=>act(e.currentTarget,'/ui/rejoin-offline',{});
$('#check').onclick=async e=>{const r=await act(e.currentTarget,'/ui/check',{});if(r&&r.result){const bad=Object.entries(r.result).filter(([,v])=>v!=='ok');toast(bad.length?t('ckBad',{l:bad.map(([n])=>n).join(', ')}):t('ckOk'),bad.length>0)}};
$('#auto').onchange=e=>act(null,'/ui/settings',{enabled:e.target.checked});
$('#after').onchange=e=>act(null,'/ui/settings',{afterMin:Number(e.target.value)});
$('#gap').onchange=e=>setP({staggerSec:Number(e.target.value)});$('#gap2').onchange=e=>setP({staggerSec:Number(e.target.value)});
$('#placeSave').onclick=e=>act(e.currentTarget,'/ui/settings',{placeId:Number($('#place').value.trim())});
$('#no3d').onchange=e=>setP({no3d:e.target.checked});$('#lowGfx').onchange=e=>setP({lowGfx:e.target.checked});$('#minimize').onchange=e=>setP({minimize:e.target.checked});
$('#fps').onchange=e=>setP({fps:Number(e.target.value)});$('#trimMin').onchange=e=>setP({trimMin:Number(e.target.value)});
$('#trim').onclick=e=>act(e.currentTarget,'/ui/trim',{});$('#minAll').onclick=e=>act(e.currentTarget,'/ui/minimize',{});
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
applyLang();setView(view);load();
setInterval(()=>{if(!document.hidden&&$('#modal').hidden)load()},3000);
</script>
